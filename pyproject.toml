[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exsoftware"
version = "0.6.0"
description = "Software that explains software — deterministic static analysis, not an AI wrapper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pefile>=2023.2.7",
    "pyelftools>=0.31",
    "olefile>=0.47",
    "pypdf>=5.0.0",
    "Pillow>=10.0.0",
    "cryptography>=42.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
exsoftware = "exsoftware.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exsoftware = ["ui/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
